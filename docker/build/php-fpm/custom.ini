; Configurações de upload sem limites
post_max_size = -1
upload_max_filesize = -1
max_execution_time = -1
max_input_time = -1
memory_limit = -1

; Exibições de erros
display_errors = On
error_reporting = E_ALL

; Configurações de extensões
extension=mongodb.so
zend_extension=opcache.so
extension=redis.so
